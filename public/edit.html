<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Consulta - Sistema de API</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="bi bi-database-gear me-2"></i>
          Sistema de API
        </a>
        <div class="navbar-nav ms-auto">
          <div class="nav-item">
            <span class="navbar-text me-3">
              <i class="bi bi-person-circle me-1"></i>
              <span id="currentUser">Admin</span>
            </span>
            <a href="index.html" class="btn btn-outline-light btn-sm me-2">
              <i class="bi bi-house me-1"></i>
              Dashboard
            </a>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">
              <i class="bi bi-box-arrow-right me-1"></i>
              Cerrar Sesión
            </button>
          </div>
        </div>
      </div>
    </nav>

      <!-- Page Header -->
      <div class="row justify-content-center mt-4">
        <div class="col-lg-8">
          <div class="row align-items-center mb-4">
            <!-- Columna izquierda: título y descripción -->
            <div class="col-md-8">
              <h1 class="h3 mb-2">
                <i class="bi bi-pencil-square text-primary me-2"></i>
                Editar Consulta
              </h1>
              <p class="text-muted mb-0">Modifica una consulta SQL existente</p>
            </div>

            <!-- Columna derecha: botón -->
            <div class="col-md-4 text-end">
              <a href="index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left me-2"></i>
                Volver al Dashboard
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Edit Query Form -->
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow form-container">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">
                <i class="bi bi-database-edit me-2"></i>
                Editar Consulta Existente
              </h5>
            </div>
            <div class="card-body">
              <form id="editQueryForm">
                <!-- Hidden fields for query data -->
                <input type="hidden" id="query_id" name="query_id" />

                <div class="mb-3">
                  <label for="edit_title" class="form-label">
                    <i class="bi bi-tag me-1"></i>
                    Título de la Consulta
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="edit_title"
                    name="edit_title"
                    placeholder="Ej: Usuarios Activos"
                    required
                  />
                  <div class="form-text">
                    Nombre descriptivo para identificar la consulta
                  </div>
                </div>

                <div class="mb-3">
                  <label for="edit_description" class="form-label">
                    <i class="bi bi-card-text me-1"></i>
                    Descripción (Opcional)
                  </label>
                  <textarea
                    class="form-control"
                    id="edit_description"
                    name="edit_description"
                    rows="3"
                    placeholder="Describe el propósito de esta consulta..."
                  ></textarea>
                </div>

                <div class="mb-3">
                  <label for="edit_sql_query" class="form-label">
                    <i class="bi bi-code-slash me-1"></i>
                    Consulta SQL
                    <span class="badge bg-info text-dark ms-2"
                      >Solo SELECT</span
                    >
                  </label>
                  <textarea
                    class="form-control font-monospace"
                    id="edit_sql_query"
                    name="edit_sql_query"
                    rows="8"
                    placeholder="SELECT * FROM tabla WHERE condicion"
                    required
                  ></textarea>
                  <div class="form-text">
                    <i class="bi bi-info-circle me-1"></i>
                    Solo se permiten consultas SELECT por seguridad. Ejemplo:
                    SELECT id, nombre FROM usuarios WHERE activo = 1
                  </div>
                </div>

                <div class="d-flex justify-content-between">
                  <a href="index.html" class="btn btn-outline-secondary">
                    <i class="bi bi-x-circle me-2"></i>
                    Cancelar
                  </a>
                  <div>
                    <button type="submit" class="btn btn-success">
                      <i class="bi bi-check-circle me-2"></i>
                      Actualizar Consulta
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="assets/js/app.js"></script>

    <!-- Page Specific JS -->
    <script>
      // Validar que sea consulta SELECT
      document
        .getElementById("edit_sql_query")
        .addEventListener("input", function () {
          const query = this.value.trim().toUpperCase();
          if (query && !query.startsWith("SELECT")) {
            this.classList.add("is-invalid");
            this.nextElementSibling.innerHTML =
              '<i class="bi bi-exclamation-triangle text-danger me-1"></i> Solo se permiten consultas SELECT por seguridad';
          } else {
            this.classList.remove("is-invalid");
            this.nextElementSibling.innerHTML =
              '<i class="bi bi-info-circle me-1"></i> Solo se permiten consultas SELECT por seguridad. Ejemplo: SELECT id, nombre FROM usuarios WHERE activo = 1';
          }
        });

      // Función para eliminar consulta
      function deleteQuery() {
        const queryId = document.getElementById("query_id").value;
        const queryTitle = document.getElementById("edit_title").value;

        if (
          confirm(
            `¿Estás seguro de que quieres eliminar la consulta "${queryTitle}"?`
          )
        ) {
          // Aquí se implementaría la lógica de eliminación
          console.log("Eliminando consulta:", queryId);
          // Redirigir al dashboard después de eliminar
          window.location.href = "index.html";
        }
      }

      // Cargar datos de la consulta al cargar la página
      document.addEventListener("DOMContentLoaded", function () {
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get("id");

        if (queryId) {
          // Aquí se cargarían los datos de la consulta desde el backend
          loadQueryData(queryId);
        } else {
          // Si no hay ID, redirigir al dashboard
          window.location.href = "index.html";
        }
      });

      // Función para cargar datos de la consulta
      function loadQueryData(queryId) {
        // Aquí se implementaría la carga de datos desde el backend
        console.log("Cargando consulta:", queryId);
      }
    </script>
  </body>
</html>
